name: portfolio
services:
  app:
    image: portfolio-backoffice:${RELEASE_TAG:-latest}
    build:
      context: ..
    container_name: portfolio_app
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /data/backoffice.sqlite
      BACKUP_PATH: /backups
    ports:
      - "127.0.0.1:3100:3001"
    volumes:
      - /var/lib/portfolio:/data
      - /var/backups/portfolio:/backups
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/backoffice/snapshot').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: portfolio_tunnel
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    env_file: ../.env.tunnel
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
